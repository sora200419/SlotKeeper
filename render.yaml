# Render Blueprint for SlotKeeper (https://render.com/docs/blueprint-spec).
# New > Blueprint > pick this repo. Render asks for every `sync: false` value; secrets never live here.
databases:
  # Paid plan on purpose: Render's free Postgres expires after 30 days, before judging ends on 12/15.
  - name: slotkeeper-db
    plan: basic-256mb
    region: oregon
    # Reachable only from Render services in this account, over the private network.
    ipAllowList: []

services:
  - type: web
    name: slotkeeper
    runtime: node
    # Starter, not free: free instances sleep after 15 idle minutes and would drop PayPal webhooks.
    # One instance only: booking locks and the write queue live in the process (lib/storage/records.ts).
    plan: starter
    numInstances: 1
    region: oregon
    branch: main
    # Manual on purpose: during a deploy the old and new instance overlap. Revisions stop them overwriting
    # each other (lib/storage/records.ts), but a clash means staff review, and releases before revisions
    # have no such check, so deploy when quiet.
    autoDeploy: false
    # `npm run build` uses webpack: Turbopack peaked at 21 GB locally and Render stops a build at 8 GB.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Cheap and credential-free; /api/health calls PayPal, which shouldn't decide if the app is up.
    healthCheckPath: /api/paypal/config
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      # No NODE_OPTIONS=--use-system-ca here: that is only for HTTPS-inspecting antivirus on a dev PC.
      # lib/storage/start.ts handles SIGTERM, so queued writes land before the process exits.
      - key: NEXT_MANUAL_SIG_HANDLE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: slotkeeper-db
          property: connectionString
      - key: NEXT_PUBLIC_PAYPAL_ENVIRONMENT
        value: sandbox
      # NEXT_PUBLIC_* values are baked in at build time; changing one needs a redeploy, not a restart.
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: STAFF_API_TOKEN
        sync: false
      # Set after the service has a URL: register https://<service>.onrender.com/api/webhooks/paypal
      # in the PayPal dashboard, then paste the Webhook ID here.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The public URL, e.g. https://slotkeeper.onrender.com (PayPal return/cancel links).
      - key: APP_URL
        sync: false
      # The owner copilot (Claude). Without it only the copilot routes are disabled.
      - key: ANTHROPIC_API_KEY
        sync: false
      # End-of-day payouts: "maria=<email>,ken=<email>" (sandbox personal accounts).
      - key: STAFF_PAYOUT_EMAILS
        sync: false
      # The business day for payouts.
      - key: BUSINESS_TIME_ZONE
        value: America/Los_Angeles
